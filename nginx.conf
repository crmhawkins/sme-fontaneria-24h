server {
    listen 80;
    server_name smefontaneria24h.com www.smefontaneria24h.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Clean URLs for legal pages
    location = /aviso-legal {
        try_files /aviso-legal.html =404;
    }
    location = /politica-privacidad {
        try_files /politica-privacidad.html =404;
    }
    location = /politica-cookies {
        try_files /politica-cookies.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect www → non-www
    if ($host = www.smefontaneria24h.com) {
        return 301 https://smefontaneria24h.com$request_uri;
    }
}
